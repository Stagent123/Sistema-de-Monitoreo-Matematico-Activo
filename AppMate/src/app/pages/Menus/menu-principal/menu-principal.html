<div>
    <app-navbar [isSidebarCollapsed]="isSidebarCollapsed"></app-navbar>
  <div class="app-container">
    <div class="position-relative">
      
      <app-side-bar
        [isSidebarCollapsed]="isSidebarCollapsed"
        (sidebarToggle)="onSidebarToggle()"
      >
      </app-side-bar>
      <button
        class="sidebar-toggle-btn"
        [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }"
        (click)="onSidebarToggle()"
      >
        <i
          [class]="
            isSidebarCollapsed ? 'fas fa-arrow-right' : 'fas fa-arrow-left'
          "
        ></i>
      </button>
  </div>

  
  <div class="content" [ngClass]="{'content-expanded': isSidebarCollapsed} ">
    <h2>Mis Enlaces</h2>
    <div class="tarjeta-enlaces">
      
      <div class="grupo-botones">
        <div class="tarjetas">
          <button>  <a href="https://www.google.com" target="_blank" class="boton-enlace">Clases Recientes</a>  </button>  
        </div>
          
        <div class="tarjetas">
          <button> <a href="https://www.wikipedia.org" target="_blank" class="boton-enlace">Actividades Pendientes</a> </button>  
        </div>
          
        <div class="tarjetas">
          <button> <a href="#" class="boton-enlace">Calendario de Actividades</a> </button>  
        </div>
            
      </div>
   </div>  
  </div>


</div>
