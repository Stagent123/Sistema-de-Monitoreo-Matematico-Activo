spring.application.name=Springboot
spring.datasource.url=jdbc:mysql://localhost:3306/monitoreo_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# 2. Driver de conexión
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Estrategia de JPA/Hibernate (update creará las tablas automáticamente al iniciar)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true